name: Release Drafter

# Manual only. Release notes are written by hand in the vX.Y.Z draft release,
# which version-release.yml publishes when VERSION changes. Running this on
# every push to main would overwrite that draft. Run it from the Actions tab
# to generate a starting draft from merged pull requests.
on:
  workflow_dispatch:

# Two manual runs at once would both rewrite the same draft.
concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    if: ${{ github.repository_owner == 'AOSSIE-Org' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create and update release drafts
      pull-requests: read # Required to scan PRs and gather changelog data
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          disable-autolabeler: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
