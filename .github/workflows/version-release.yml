name: Version Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Only release from main, including when started by hand: a manual run
    # can pick any branch, and would otherwise tag and publish that branch.
    if: ${{ github.repository_owner == 'AOSSIE-Org' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      released: ${{ steps.publish_release.outputs.released }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify actor is a maintainer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            }).catch(() => ({ data: { permission: 'none' } }));
            
            if (permission.permission !== 'admin' && permission.permission !== 'write') {
              core.setFailed(`Actor '${context.actor}' does not have write access to this repository. Aborting release.`);
            } else {
              console.log(`✓ Actor '${context.actor}' is a verified repository maintainer.`);
            }

      - name: Read VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version detected: $VERSION"

      - name: Validate VERSION format
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION must follow semantic versioning (e.g., 1.0.0)"
            exit 1
          fi
          echo "✓ Version format is valid: $VERSION"

      - name: Check if tag already exists
        id: tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            # An earlier run may have tagged and then failed before npm
            # publish. Reuse the tag so a re-run can finish the release, but
            # only if it really is this version.
            TAGGED=$(git show "v$VERSION:VERSION" 2>/dev/null | tr -d '[:space:]')
            if [ "$TAGGED" != "$VERSION" ]; then
              echo "Error: Tag v$VERSION already exists but its VERSION file says '$TAGGED'"
              exit 1
            fi
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Tag v$VERSION already exists; reusing it to finish the release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✓ Tag v$VERSION does not exist yet"
          fi

      - name: Create and push tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
          echo "✓ Created and pushed tag v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and Publish Draft Release
        id: publish_release
        uses: actions/github-script@v7
        env:
          VERSION: v${{ steps.get_version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;

            // Get all releases
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // A re-run after a failed build or publish: the release is
            // already out, so go straight on to building and publishing.
            if (releases.some(r => !r.draft && r.tag_name === version)) {
              console.log(`✓ Release ${version} is already published; continuing to npm publish`);
              core.setOutput('released', 'true');
              return;
            }

            // GitHub's generated "What's Changed" list since the last release.
            const previous = releases.find(r => !r.draft && !r.prerelease);
            const { data: generated } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              ...(previous ? { previous_tag_name: previous.tag_name } : {}),
            });

            // Prefer the draft written for this version (named or tagged
            // vX.Y.Z); otherwise fall back to any draft, such as one from
            // Release Drafter.
            const draftRelease =
              releases.find(r => r.draft && (r.name === version || r.tag_name === version)) ||
              releases.find(r => r.draft);

            if (draftRelease) {
              console.log(`Found draft release: ${draftRelease.name}`);

              // Keep the draft's own notes, but always use a freshly generated
              // list: a "What's Changed" section already in the draft (such
              // as one from Release Drafter) may be stale, so drop it.
              const notes = (draftRelease.body || '').split(/^## What's Changed/m)[0].trim();
              const body = `${notes}\n\n${generated.body}`.trim();

              // Update and publish the draft release
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                tag_name: version,
                name: version,
                body,
                draft: false,
                make_latest: 'true',
              });

              console.log(`✓ Published draft release as ${version}`);
              core.setOutput('released', 'true');
            } else {
              console.log('⚠️ No draft release found. Creating release with generated notes.');

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: version,
                name: version,
                body: generated.body,
                draft: false,
                prerelease: false,
              });

              console.log(`✓ Created and published release ${version}`);
              core.setOutput('released', 'true');
            }

      - name: Release Summary
        run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** v${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created:** ✓" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_release.outputs.released }}" = "true" ]; then
            echo "- **GitHub Release:** ✓" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **GitHub Release:** ✗ (no draft found)" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    needs: release
    if: ${{ github.repository_owner == 'AOSSIE-Org' && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Build exactly the tagged release, also when a later run finishes it.
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync version from VERSION file
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "Syncing package.json version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "✓ package.json version set to $VERSION"

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Pack package
        run: |
          # npm pack does not create the destination directory.
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - name: Upload package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: /tmp/pack/*.tgz
          retention-days: 1

  publish:
    needs: [release, build]
    if: ${{ github.repository_owner == 'AOSSIE-Org' && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: /tmp/pack

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11.5.1

      - name: Check whether this version is already on npm
        id: npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          NAME=$(tar -xOzf /tmp/pack/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish."
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        run: npm publish /tmp/pack/*.tgz --provenance --access public

      - name: Publish Summary
        run: |
          echo "### npm Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** @aossie-org/thrubox-client" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** https://www.npmjs.com/package/@aossie-org/thrubox-client" >> $GITHUB_STEP_SUMMARY
          echo "- **Provenance:** ✓ (supply-chain attestation enabled)" >> $GITHUB_STEP_SUMMARY
